name: Publish Nuget Package

env:
    NUGET_PACKAGE_NAME_VERSION: "QueryDB.1.3.0.nupkg"

on:
  workflow_dispatch:

jobs:
  build:
    name: Publish Nuget Package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
        dotnet-version: [ '3.1.x' ]
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      
    - name: Dotnet Version (${{ matrix.dotnet-version }})
      uses: actions/setup-dotnet@v5
      with:
          dotnet-version: '3.1.x'
          
    - name: Create Package
      run: dotnet pack --configuration=Release QueryDB/QueryDB.csproj
      
    - name: Publish Nuget Package
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: dotnet nuget push QueryDB/bin/Release/${{ env.NUGET_PACKAGE_NAME_VERSION }} -s https://api.nuget.org/v3/index.json -k $env:NUGET_API_KEY
      